[icedos.desktop]
accentColor = "" # Accepts a libadwaita name (blue/teal/green/yellow/orange/red/pink/purple/slate), a base16 slot (base08..base0F), or a hex (RRGGBB / #RRGGBB). Empty defaults to "purple". Under GNOME, non-name inputs trigger a warning since GNOME's accent-color dconf key only accepts named values.
autologinUser = ""
keyboardLayouts = [] # xkb layouts, e.g. ["us", "gr"] (first is primary). Empty = leave each DE at its own default (no layout override).
timezone = "Europe/Bucharest"
wallpaper = "" # Absolute path to image. Empty = user/UI-managed (no rebuild override).

[icedos.desktop.clock]
date = false # Show the month and day of the month on the clock
firstDayOfTheWeek = "monday" # monday, tuesday, wednesday, thursday, friday, saturday, sunday
hourFormat24 = true # false = 12-hour AM/PM
seconds = true
weekday = false # Show the day of the week on the clock

[icedos.desktop.bookmarks]
extras = []
documents = true
downloads = true
music = true
pictures = true
public = true
templates = true
videos = true

[icedos.desktop.windows]
activeHint = true
activeHintSize = 1
maximizeButton = true
minimizeButton = true

[icedos.desktop.windows.focus]
delay = 300 # ms; only applies when focus follows the mouse
followsMouse = false # Focus follows the mouse cursor instead of click-to-focus

[icedos.desktop.users.username.idle.disable-monitors]
enable = true
seconds = 600

[icedos.desktop.users.username.idle.lock]
enable = true
seconds = 900

[icedos.desktop.users.username.idle.suspend]
enable = true
seconds = 1800

# [icedos.desktop.applications.*]
# name = "" # Desktop-id; empty = unmanaged (DE/apps decide)
# package = "" # Nixpkgs name; empty = not auto-installed

[icedos.desktop.applications.audio-player]
name = "io.bassi.Amberol.desktop"
package = "amberol"

[icedos.desktop.applications.browser]
name = ""
package = ""

[icedos.desktop.applications.editor]
name = ""
package = ""

[icedos.desktop.applications.archive-manager]
name = ""
package = ""

[icedos.desktop.applications.image-viewer]
name = "org.gnome.Loupe.desktop"
package = "loupe"

[icedos.desktop.applications.office-suite]
name = "onlyoffice-desktopeditors.desktop"
package = "onlyoffice-desktopeditors"

[icedos.desktop.applications.torrent]
name = "de.haeckerfelix.Fragments.desktop"
package = "fragments"

[icedos.desktop.applications.video-player]
name = "io.github.celluloid_player.Celluloid.desktop"
package = "celluloid"

[icedos.desktop.applications.wine]
name = "io.github.Faugus.faugus-launcher.desktop"
package = "faugus-launcher"

[icedos.desktop.xdg-desktop-portal]
forceGtkFilePicker = false
